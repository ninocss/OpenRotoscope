name: Compact accessibility patch

on:
  push:
    branches:
      - app-redesign

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'ui: harden compact accessibility'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: app-redesign
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply compact accessibility patch
        run: python scripts/patch_compact_accessibility.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check
          git add app/openroto/ui/PolishedMain.qml app/openroto/ui/TimedMain.qml app/openroto/ui/ObjectRemovalMain.qml
          git commit -m "ui: harden compact accessibility"
          git push origin HEAD:app-redesign
