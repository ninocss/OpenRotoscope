name: Compact accessibility patch

on:
  push:
    branches:
      - app-redesign

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: app-redesign
      - name: Apply compact accessibility patch
        run: python3 scripts/patch_compact_accessibility.py
      - name: Commit patch and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check
          git add app/openroto/ui/PolishedMain.qml app/openroto/ui/TimedMain.qml app/openroto/ui/ObjectRemovalMain.qml
          git rm .github/workflows/compact-a11y-patch.yml scripts/patch_compact_accessibility.py
          git commit -m "ui: harden compact accessibility"
          git push origin HEAD:app-redesign
