name: Drawer focus patch

on:
  push:
    branches:
      - app-redesign

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: app-redesign
      - name: Apply focus restore patch
        run: python3 scripts/patch_drawer_focus_restore.py
      - name: Commit patch and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check
          git add app/openroto/ui/PolishedMain.qml
          git rm .github/workflows/drawer-focus-patch.yml scripts/patch_drawer_focus_restore.py
          git commit -m "ui: restore compact drawer focus after escape"
          git push origin HEAD:app-redesign
