[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "openroto"
version = "0.1.0"
description = "Local AI rotoscoping and object removal for DaVinci Resolve"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "OpenRoto contributors" }]
keywords = ["davinci-resolve", "rotoscoping", "video", "sam2", "inpainting"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "PySide6>=6.8,<6.10",
  "numpy>=2.1,<3",
  "Pillow>=11,<13",
  "platformdirs>=4.3,<5",
]

[project.urls]
Homepage = "https://github.com/ninocss/OpenRotoscope"
Repository = "https://github.com/ninocss/OpenRotoscope"
Issues = "https://github.com/ninocss/OpenRotoscope/issues"

[project.optional-dependencies]
inference = [
  "torch>=2.11,<2.12",
  "torchvision>=0.26,<0.27",
  "sam-2 @ git+https://github.com/facebookresearch/sam2.git",
  "huggingface-hub>=0.30,<1",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "pyinstaller>=6.13,<7",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
]

[project.scripts]
openroto = "openroto.main:main"

[tool.hatch.build.targets.wheel]
packages = ["app/openroto"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
pythonpath = ["app"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
